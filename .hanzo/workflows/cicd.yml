# Canonical CI/CD — imports the shared hanzoai/ci reusable workflow. All real
# config (images, test) lives in the repo-root hanzo.yml; this file is just
# the trigger + the import. Same shape every hanzo/lux/zoo repo uses.
#
# This replaces the legacy upstream-Temporal workflow suite (run-tests
# sharding matrices, promote-* lanes, flaky-test reporting), which targeted
# the pre-rip fork layout and had been red on every run since the ZAP-native
# rewrite (yq-less runners, deleted directories, Temporal-era tooling).
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  cicd:
    # `.hanzo/workflows/`, matching where this caller lives. Reusables resolve
    # through services/actions.ResolveUses, which enforces the WORKFLOW_DIRS
    # allowlist on the referenced path too, so a `uses:` naming
    # `.github/workflows` is refused once that list narrows to
    # `.hanzo/workflows` alone — and refused at InsertRun, before any run row
    # exists, so it reads as silence rather than as a failure. hanzoai/ci
    # publishes build.yml at both paths from every tag; @v1 is unchanged.
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
